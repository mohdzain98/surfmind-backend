ingestion:
  history_cap:
    free: 100
    pro: 500
  bookmark_cap: 250

sync:
  code_expiry_minutes: 10
  code_rate_limit_per_hour: 5

admin:
  token_expiry_minutes: 720

search_history:
  retention_cap: 20

fast_mode:
  default_preset: balanced
  relative_cutoff: 0.6
  max_results_cap: 10
  presets:
    broad: { threshold: 0.4, max_results: 5 }
    balanced: { threshold: 0.5, max_results: 5 }
    precise: { threshold: 0.7, max_results: 5 }

# Flags queries that ask SurfMind to *do* something with a page
# ("summarize this", "make bullet points") instead of finding one, so the
# response can carry a notice. Jev's yes/no (noul) primitive first; the
# post-processing LLM as fallback if Jev fails.
task_detection:
  jev_model: jev-latest
  threshold: 0.6

rag:
  provider: openai
  model:
    free: gpt-4.1-mini
    pro: gpt-5.6-terra
  temperature: 0.2
  max_tokens:
    free: 512
    pro: 1024
  fallback:
    provider: gemini
    model:
      free: gemini-2.5-flash-lite
      pro: gemini-3.5-flash-lite

post_processing:
  provider: gemini
  model:
    free: gemini-2.5-flash-lite
    pro: gemini-3.5-flash-lite
  temperature: 0.0
  max_tokens: 256
  fallback:
    provider: openai
    model:
      free: gpt-4o-mini
      pro: gpt-4.1-mini

embeddings:
  provider: openai
  model: text-embedding-3-small
  fallback:
    provider: gemini
    model: gemini-embedding-001

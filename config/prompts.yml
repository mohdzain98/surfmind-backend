prompt:
  section_summary:
    system: |
      You summarize one heading-scoped section of a web page for use as
      search-embedding input. The summary is never shown to a user directly
      — it exists purely to make semantic search match this section better.
    user: |
      Summarize the following section in 1-3 sentences, dense with the key
      terms and facts a search query would need to match against. Do not
      add information that isn't present in the content.

      Heading path: {heading_path}

      Content:
      {content}

      Summary:

  history:
    system: |
      You are a helpful assistant that help user find visited sites from browser history. The content provided is the retieved history according to the query. You provide the summary based on the content and URL provided.
    user: |
      Generate a short summary based on the provided context and date. Include the corresponding URL in your response.
      Context date: {date}
      URL: {url}

      Content:
      {context}

      Instructions:
      - Provide a brief and accurate summary of the context.
      - If you recognize the content, include meaningful information about it.
        Example:
          - context: "Facebook"
          - response: "Facebook is a social media platform that allows users to connect with others, share media, and stay updated. Founded in 2004 by Mark Zuckerberg, it is one of the largest networks globally."
      - If the content is unknown or empty, reply with: **"Kindly adjust your search for better result."**
      - Do **not** provide information beyond the given context or hallucinate unknown facts.

  bookmark:
    system: |
      You are a helpful assistant that help user find visited sites from browser bookmarks. The bookmark given is retireived from the bookmark storage according to the query. You provide the summary based on the content and URL provided.
    user: |
      Generate a short summary based on the provided context and date. Include the corresponding URL in your response.
      URL: {url}

      Content:
      {context}

      Instructions:
      - Provide a brief and accurate summary of the content.
      - If you recognize the content, include meaningful information about it.
        Example:
          - content: "Facebook"
          - response: "Facebook is a social media platform that allows users to connect with others, share media, and stay updated. Founded in 2004 by Mark Zuckerberg, it is one of the largest networks globally."
      - If the content is unknown or empty, reply with: **"Kindly adjust your search for better result."**
      - Do **not** provide information beyond the given context or hallucinate unknown facts.

  combined:
    system: |
      You are a helpful assistant that helps users find sites from their browser history and bookmarks. The content provided is retrieved from both sources according to the query. You provide a summary based on the content and URL provided, and indicate whether the result is from history or a bookmark.
    user: |
      Generate a short summary based on the provided context. Include the corresponding URL and indicate whether it is from browser history or a bookmark.
      Context date: {date}
      URL: {url}

      Content:
      {context}

      Instructions:
      - Provide a brief and accurate summary of the context.
      - Mention whether this result is from browser history or bookmarks.
      - If you recognize the content, include meaningful information about it.
        Example:
          - context: "Facebook"
          - response: "Facebook is a social media platform that allows users to connect with others, share media, and stay updated. Founded in 2004 by Mark Zuckerberg, it is one of the largest networks globally."
      - If the content is unknown or empty, reply with: **"Kindly adjust your search for better result."**
      - Do **not** provide information beyond the given context or hallucinate unknown facts.

  relevance: |
    You are a strict relevance filtering assistant.

    The user has asked the following query:
    "{query}"

    Below are numbered content blocks.
    Each block contains:
    - Title
    - Source URL
    - Content snippet

    Note: Some blocks may come from bookmarks, where the content is only the page title.
    For such blocks, judge relevance using the Title and Source URL — do NOT penalise a
    block just because its content is short or sparse. That is about length, not about
    whether the subject matches — a short block about the right subject is still relevant.

    Content blocks:
    {content_blocks}

    Your task: determine whether each block is actually *about* what the query is asking
    for — not merely adjacent to it or mentioning it in passing.

    A block is relevant only if:
    - Its Content substantively describes, answers, or is itself the subject the query
      asks about, OR
    - For sparse bookmark blocks (title/URL only, no real content), the Title/URL
      unambiguously identify that subject.

    A block is NOT relevant if:
    - The query's subject appears only as a passing mention, list item, or tangential
      reference inside content that is actually about something else — e.g. a personal
      portfolio/resume page that merely lists a project by name without describing it.
      A keyword match alone is never sufficient on its own.
    - It's about a different product, page, or topic — even one from the same person,
      company, or brand family, or one that merely shares similar branding/domain.
    - It belongs to a clearly unrelated domain (e.g., scholarships for a math query).
    - Neither the Title, URL, nor Content substantively connects to the query's subject.

    When you're unsure whether a mention is substantive or just a passing reference,
    treat it as NOT relevant. A false positive (keeping an off-topic source) is worse
    than a false negative here — only sources that actually inform the answer should be
    cited back to the user.

    Output Format Rules:
    - Respond ONLY with a JSON-style list of integers.
    - Example: [2, 4]
    - If all blocks are relevant, return [0]
    - Do NOT return explanations.
    - Do NOT return text.
    - Do NOT return tuples like (1,2).
    - Do NOT return a single number like 2.

    ### Examples:
      Query: "What is Facebook?"
      Content Blocks:
        1.  Title: "Facebook overview"
            Source: facebook.com
            Content: "Facebook is a social media platform..."
        2.  Title: "Google search engine"
            Source: google.com
            Content: "Google helps users search the web."

      Answer: [2]

      Query: "a chrome extension which searches history and bookmarks"
      Content Blocks:
        1.  Title: "SurfMind — Smarter Browsing"
            Source: surfmind.docschat.in
            Content: "SurfMind is a Chrome extension that lets you search your browsing history and bookmarks instantly."
        2.  Title: "Mohd Zain | Data Scientist"
            Source: mohdzain.com
            Content: "Projects: GATE 2022 prep notes, SurfMind, portfolio site redesign."
        3.  Title: "Docschat — AI Document Intelligence"
            Source: docschat.in
            Content: "Docschat lets you chat with your uploaded documents using AI."

      Answer: [2,3]

      Query: "Document chatting website"
      Content blocks:
        1.  Title: "Docschat"
            Source: docschat.in
            content: "Docschat : an innovating document chatting website"
        2.  Title: "Chat with your documents in realtime with docuchat"
            Source: docuchat.com
            content: "Chat with your documents in realtime with docuchat"

      Answer: [0]

      Query: "Saudi Aramco"
      Content blocks:
        1.  Title: "Riding bike in mountains is a great way to enjoy nature"
            Source: bikers.com
            content: "Riding bike in mountains is a great way to enjoy nature"
        2.  Title: "Higher senior secondary school is a place where students learn"
            Source: schools.com
            content: "Higher senior secondary school is a place where students learn"

      Answer: [1,2]

    Now, based on the current query and content blocks, reply with the list of irrelevant content numbers.

    Answer:

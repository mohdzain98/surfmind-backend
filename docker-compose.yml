services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: surfmind_app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: surfmind_db
    ports:
      - "5432:5432"
    volumes:
      - surfmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfmind_app -d surfmind_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  surfmind_pgdata:

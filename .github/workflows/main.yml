name: Deploy

on:
  push:
    branches: [ main ]
    paths-ignore: ["README.md"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e

          cd surfmind/surfmind-backend || exit 1

          echo "Fetching latest code..."
          git fetch origin

          echo "Resetting to origin/main..."
          git reset --hard origin/main

          echo "Cleaning untracked files (excluding persistent data)..."
          git clean -fd -e data/ -e logs/ -e senv/ -e requirements.lock -e .env

          if [ ! -f .env ]; then
            echo ".env is missing — copy it onto the server manually before deploying (DATABASE_URL, REDIS_HOST/PORT, OPENAI_API_KEY, GEMINI_API_KEY, ENVIRONMENT=production). Aborting."
            exit 1
          fi

          echo "Activating virtual environment..."
          source senv/bin/activate

          echo "Checking dependencies..."
          if [ ! -f requirements.lock ] || ! cmp -s requirements.txt requirements.lock; then
            echo "Installing dependencies..."
            pip install -r requirements.txt
            cp requirements.txt requirements.lock
          else
            echo "Dependencies unchanged. Skipping install."
          fi

          echo "Running database migrations..."
          alembic upgrade head

          echo "Reloading service (zero downtime)..."
          sudo systemctl restart surfmind.service || {
            echo "Reload failed. Restarting service..."
            sudo systemctl restart surfmind.service
          }

          echo "Deployment completed successfully."